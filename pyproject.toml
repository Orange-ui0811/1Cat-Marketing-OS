[project]
name = "onecat-hermes-os"
version = "0.1.0"
requires-python = ">=3.11,<3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["apps/runtime-api", "apps/organization-mcp", "apps/runtime-worker"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

